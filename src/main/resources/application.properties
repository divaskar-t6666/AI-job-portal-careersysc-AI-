# APPLICATION CONFIGURATION
spring.application.name=CareerSync AI

# SERVER CONFIGURATION
server.port=8080

# DATABASE CONFIGURATION
spring.datasource.url=jdbc:mysql://localhost:3306/ai_multi_job_portal
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# JPA / HIBERNATE CONFIGURATION
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# LOGGING CONFIGURATION
logging.level.org.hibernate.SQL=DEBUG
# Keep SQL bind-value tracing disabled because it can log personal data.
logging.level.org.springframework.security=INFO

file.upload-dir=uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# JWT CONFIGURATION
# Local development signing secret; replace/use environment-backed configuration before deployment.
jwt.secret=${JWT_SECRET}
# GEMINI API CONFIGURATION
# Set GOOGLE_API_KEY in the backend process environment; do not store it in source files.
gemini.api.key=${GOOGLE_API_KEY}
